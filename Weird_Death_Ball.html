<!DOCTYPE html>

<title>Weird Death Ball</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}

.keys{max-width:1352px;width:100%;display:flex;gap:24px;flex-wrap:wrap;margin-top:10px;color:var(--mut)}
b{color:var(--fg)}
</style></head><body>
<canvas id="c" width="1352" height="644" tabindex="0"></canvas>
<div class="keys">
<div><b style="color:#42a5f5">Blue</b>: ←/→ move, ↑ jump, ↓ drop, X grapple, C weight, Z dash</div>
<div><b style="color:#ef5350">Red</b>: A/D move, W jump, S drop, F grapple, G weight, H dash</div>
<div>R restart. Click the game first so it gets keyboard focus.</div>
</div>
<script>
// Weird Death Ball - single-file prototype. Custom circle physics, fixed 120 Hz timestep.
const W = 1000, H = 500, NETX = W / 2;
const PL = 32; // one "player length" (diameter)
const RANGE = 3 * PL; // grapple reach
const RUN = 2 * PL, RISE = 0.75 * PL, PK = 5, NOTCH = 2; // slopes: 2 player lengths long, three quarters of a player tall; PK = half-gap between the middle peaks
const GOAL_Y1 = H - RISE, GOAL_Y0 = GOAL_Y1 - 5 * PL; // goal opening sits just above the goal ramps and is 5 player lengths tall; the jut above it reaches down to GOAL_Y0

const DT = 1 / 120, WIN = 9;
const G = 410; // free-fall gravity (u/s^2): big arcs in the demo fall at ~320 px/s^2
const G_FLOAT = 130; // gravity while UP is held in the air: plain jumps are long, symmetric, floaty arcs (~90-117 px/s^2)
const JUMP_V = 150; // launch speed of a plain jump (u/s): ~88 u apex, ~2 s airtime with G_FLOAT
const DASH_V = 420, DASH_CD = 0.35, DASH_FX = 0.25; // dash impulse (u/s), minimum gap between dashes while on the floor (s), streak lifetime (s)
const DOWN_G = 2.2; // gravity multiplier while DOWN is held (drop / fast-fall)

const BALL_G = 170; // ball gravity (u/s^2): ~140 px/s^2 in the demo

        c.y = q.y + ny * c.r;

            continue;

            const out = Math.min(PAD_MAX, Math.max(PAD_KICK, -vn * PAD_E));

            c.vy += (out - vn) * ny;
            hud.pad[i] = 1;

            c.vy -= vn * ny;

// by the goal) can pop the opposite far half up a little, kicking whatever is standing there. Nothing happens near the net.
// One signed tilt carries every hit's momentum, so hits from the two sides cancel: a slam on the side that is popping pushes it back down.
const SAW_HALF = NETX / 2; // half of a side's floor: only the half by the goal takes part
const SAW_MIN = 480; // impact momentum (mass x speed into the floor, u/s) a hit needs to move the seesaw: only real slams (a weighted drop after a grapple jump), not jumps or dribbling
const SAW_GAIN = 1.2, SAW_VMAX = 240; // tilt speed (u/s) = (momentum - SAW_MIN) * SAW_GAIN, capped; this is also the kick given to things resting on the rising end
const SAW_K = 100, SAW_C = 20; // floor spring (critically damped): it pops up fast and settles back down without bouncing

const sawQ = side => Math.max(0, side === 1 ? saw.t : -saw.t); // pop height of a side's far half
const sawQV = side => (sawQ(side) > 0 ? (side === 1 ? saw.v : -saw.v) : 0); // its speed (nothing moves on the end that rests on the ground)
// How much of a side's pop applies at x: 0 on the half by the net, rising smoothly to full over the quarter by the goal.

const sawV = x => -(sawQV(0) * sawW(x, 0) + sawQV(1) * sawW(x, 1)); // floor speed at x (negative = rising)

}

// A hit on the end that is already popping pushes it back down, so equal slams from both sides cancel.

        this.x = 0;
        this.y = 0;
        this.vx = 0;
        this.vy = 0;
        this.r = 16;
        this.ground = false;
        this.alive = true;
        this.rope = null;
        this.pending = null;
        this.onBall = false;
        this.len = 0;
        this.hookAng = 0;
        this.ropeGround = false;
        this.ropeShown = false;
        this.prevUp = false;
        this.prevZ = false;
        this.prevX = false;

        this.y = H - this.r;

        this.alive = true;
        this.rope = null;
        this.pending = null;
        this.onBall = false;
        this.ground = false;
        this.ropeShown = false;
        this.ropeBase = null;
